[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-experiments"
version = "0.4.0"
description = "Experiment-domain plugins for the Forge platform: spacetime geometry and matter."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # The platform provides forge_domain, forge_sdk, and the services these
    # plugins contribute to (apps.coordinator.store, bundles, plugin
    # registry).  Version-pinned to the compatibility range the manifests
    # declare, so an incompatible platform fails at install rather than at
    # plugin-registration time.
    "forge-platform>=0.4,<0.5",
    # Domain science dependencies.  Deliberately declared here rather than
    # inherited from the platform: the geometry pipeline's CAS and the
    # matter models are experiment concerns, and a future platform without
    # a symbolic domain installed should not be forced to carry SymPy.
    "sympy>=1.14",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# How Forge finds these plugins.  Nothing else registers them: the platform
# discovers `forge.plugins` entry points at startup and isolates failures
# per plugin, so a broken or incompatible plugin here cannot stop Forge.
# Worker-side contributions (platform backlog P-3). A fabric agent has no
# database and no coordinator, so it reads this group rather than building
# the plugin registry: self-test suites and job executors only.
[project.entry-points."forge.worker"]
geometry = "forge_geometry.worker"
pendulum = "forge_pendulum.worker"

[project.entry-points."forge.plugins"]
geometry = "forge_geometry.plugin:plugin"
matter = "forge_matter.plugin:plugin"
# The reference plugin. Installed like any other, so `python -m
# forge_sdk.testing --all` checks it beside the real domains.
pendulum = "forge_pendulum.plugin:plugin"

# Explicit package map rather than multi-root discovery.  Two `where` roots
# push setuptools into a copy-based editable install that silently omits
# subpackages and package data — the plugin then registers and fails at
# first use.  An explicit map keeps editable installs pointing at the source
# tree, which is also what makes plugin development a no-publish loop.
[tool.setuptools]
package-dir = { forge_geometry = "plugins/geometry/forge_geometry", forge_math = "plugins/geometry/forge_math", forge_metrics = "plugins/geometry/forge_metrics", forge_validation = "plugins/geometry/forge_validation", forge_verify = "plugins/geometry/forge_verify", forge_matter = "plugins/matter/forge_matter", forge_pendulum = "plugins/example/forge_pendulum" }
packages = [
    "forge_geometry", "forge_geometry.app",
    "forge_math", "forge_metrics", "forge_validation", "forge_verify",
    "forge_matter", "forge_matter.app",
    "forge_pendulum", "forge_pendulum.app",
]

[tool.setuptools.package-data]
# Domain data ships inside its plugin package so it resolves identically
# from a source checkout and an installed wheel (the platform's
# limitations P8 lesson, applied here from the start).
forge_geometry = ["metrics/*/*.yaml", "schemas/*.json", "sage/*.md", "ui/*.js"]
forge_matter = ["data/*.yaml", "schemas/*.json", "sage/*.md", "ui/*.js"]
# Alembic branches are non-module files: undeclared, the wheel ships
# without them and the plugin silently has no schema on a server
# database (platform P-5, and the packaging lesson from P8).
forge_pendulum = ["sage/*.md", "ui/*.js", "migrations/*.py",
                  "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["plugins", "integration-tests"]
markers = [
    "validation: scientific validation tests against known results",
    "convergence: resolution-sensitivity tests",
    "slow: long-running symbolic computations",
    "postgres: needs a real PostgreSQL server (FORGE_TEST_POSTGRES_URL); skipped otherwise",
    "auth: drives the real authentication gate; sets FORGE_AUTH itself (see conftest.py)",
]
