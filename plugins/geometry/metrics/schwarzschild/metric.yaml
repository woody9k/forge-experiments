name: schwarzschild
version: 1.0.0
description: >
  Schwarzschild exterior solution in Schwarzschild coordinates (t, r, theta,
  phi), geometrized units (G=c=1). Vacuum: Ricci tensor and Einstein tensor
  vanish for r > 2M while the Riemann tensor and Kretschmann scalar
  (K = 48 M^2 / r^6) do not. The r = 2M surface is a coordinate singularity
  in these coordinates, not a curvature singularity.
coordinate_system: spherical
dimensions: 4
coordinates: [t, r, theta, phi]
signature: "-+++"
units:
  mode: geometrized
parameters:
  mass:
    symbol: M
    default: 1.0
    description: "Central mass in geometrized units."
    minimum: 0.0
metric:
  g_00: "-(1 - 2*M/r)"
  g_01: "0"
  g_02: "0"
  g_03: "0"
  g_11: "1/(1 - 2*M/r)"
  g_12: "0"
  g_13: "0"
  g_22: "r**2"
  g_23: "0"
  g_33: "r**2 * sin(theta)**2"
assumptions:
  - "M > 0"
  - "r > 2*M"
  - "theta > 0"
source_citation: "Schwarzschild (1916); form as in Misner, Thorne & Wheeler, Gravitation (1973), eq. 23.29; Kretschmann scalar 48 M^2/r^6 e.g. Henry, Astrophys. J. 535 (2000) 350."
author: metric-forge
