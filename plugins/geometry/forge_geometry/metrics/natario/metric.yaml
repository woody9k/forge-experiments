name: natario
version: 1.0.0
description: >
  Natario-style zero-expansion warp metric (Natario 2002) in comoving
  spherical coordinates (t, r, theta, phi), geometrized units.
  ds^2 = -dt^2 + h_ij (dx^i - X^i dt)(dx^j - X^j dt) with flat h and a
  divergence-free axisymmetric shift built from the Stokes stream function
  psi = -v f(r) r^2 sin^2(theta):
    X^r     = -2 v f(r) cos(theta)
    X^theta =  v (2 f(r) + r f'(r)) sin(theta) / r.
  Natario leaves f general with f -> 0 in the bubble interior and f -> 1/2
  far away; this definition fixes the smooth wall
  f(r) = (1 + tanh(sigma (r - R))) / 4, which satisfies those limits.
  Headline published property to reproduce: the Eulerian congruence has
  identically zero expansion (a "warp drive with zero expansion"), and the
  metric still violates the weak energy condition.
coordinate_system: spherical
dimensions: 4
coordinates: [t, r, theta, phi]
signature: "-+++"
units:
  mode: geometrized
parameters:
  velocity:
    symbol: v
    default: 0.5
    description: "Bubble coordinate velocity (units of c)."
  radius:
    symbol: R
    default: 1.0
    description: "Bubble radius."
    minimum: 0.0
  wall_steepness:
    symbol: sigma
    default: 8.0
    description: "Wall steepness parameter."
    minimum: 0.0
metric:
  g_00: "-1 + (-2*v*((1 + tanh(sigma*(r - R)))/4)*cos(theta))**2 + r**2 * (v*(2*((1 + tanh(sigma*(r - R)))/4) + r*(sigma*(1 - tanh(sigma*(r - R))**2)/4))*sin(theta)/r)**2"
  g_01: "2*v*((1 + tanh(sigma*(r - R)))/4)*cos(theta)"
  g_02: "-r**2 * v*(2*((1 + tanh(sigma*(r - R)))/4) + r*(sigma*(1 - tanh(sigma*(r - R))**2)/4))*sin(theta)/r"
  g_03: "0"
  g_11: "1"
  g_12: "0"
  g_13: "0"
  g_22: "r**2"
  g_23: "0"
  g_33: "r**2 * sin(theta)**2"
assumptions:
  - "R > 0"
  - "sigma > 0"
  - "r > 0"
  - "theta > 0"
# Positive radius only (the metric assumes r > 0) covering the bubble wall
# at r = R, away from the r = 0 and theta = 0, pi coordinate degeneracies of
# spherical coordinates.  The radial bounds are in units of the bubble
# radius so the window follows the wall; theta is an angle and is
# deliberately NOT scaled — which is why scale_with is per-axis.
default_grid:
  vary:
    r: [0.1, 3.0]
    theta: [0.1, 3.04]
  scale_with:
    r: radius
  fix:
    t: 0.0
    phi: 0.0
source_citation: "Natario, 'Warp drive with zero expansion', Class. Quantum Grav. 19 (2002) 1157-1165."
author: metric-forge
